# The namespace denies everything by default (Logbook's deploy brings that
# policy). This opens what Muster needs and no more.
#
# In:  the workers (every pod of the cs-workers namespace), Conn and
#      Shipkeeper, on 8080.
# Out: Logbook on 5432, and the cluster's name service to find it.
#
# Muster also calls the cluster's API, to ask whose token a caller presented
# (TokenReview, SPEC 5.2). A NetworkPolicy cannot name the API server, so the
# last egress rule allows TCP 6443 to kube-system and to the control-plane
# node addresses of this cluster (the same rule the cluster carried by hand
# as muster-to-kube-apiserver).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: muster
  namespace: clearedstack
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: muster
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cs-workers
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["conn", "shipkeeper"]
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: logbook
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - ipBlock:
            cidr: 192.168.8.108/32
        - ipBlock:
            cidr: 192.168.8.187/32
        - ipBlock:
            cidr: 192.168.8.202/32
        - ipBlock:
            cidr: 192.168.8.200/32
      ports:
        - protocol: TCP
          port: 6443
