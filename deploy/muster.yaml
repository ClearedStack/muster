# Muster: one small pod that hands out work, records every result in Logbook
# and takes in edit proposals.
#
# Two Secrets are not in this repository, and are made in the cluster by
# whoever deploys Muster:
#   muster-database   key url:  where Logbook is, as a PostgreSQL address for
#                               the muster role
#   muster-salt       key salt: the secret the daily salt is made from, at
#                               least 32 bytes
apiVersion: v1
kind: ServiceAccount
metadata:
  name: muster
  namespace: clearedstack
  labels:
    app.kubernetes.io/name: muster
---
# Muster asks the cluster whose token a caller presented (a TokenReview). This
# is the cluster's own role for that and nothing else: it cannot read, change
# or delete anything.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: muster-auth-delegator
  labels:
    app.kubernetes.io/name: muster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: muster
    namespace: clearedstack
---
# The ownership map: which elements of the site an edit proposal may name.
# None yet, so every proposal is refused until one is listed here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: muster-ownership-map
  namespace: clearedstack
  labels:
    app.kubernetes.io/name: muster
data:
  ownership_map.json: |
    {"elements": {}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: muster
  namespace: clearedstack
  labels:
    app.kubernetes.io/name: muster
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: muster
  template:
    metadata:
      labels:
        app.kubernetes.io/name: muster
    spec:
      serviceAccountName: muster
      # Muster presents its own token when it asks whose token a caller sent.
      automountServiceAccountToken: true
      enableServiceLinks: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: ["arm64"]
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["cm3588-plus"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532   # so the salt file is readable by this user
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: muster
          image: muster
          env:
            - name: MUSTER_AUTH
              value: kubernetes
            - name: MUSTER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: muster-database
                  key: url
            - name: MUSTER_OWNERSHIP_MAP
              value: /etc/muster/ownership_map.json
            - name: MUSTER_SALT_FILE
              value: /etc/muster-salt/salt
            # Under the 48Mi below, so the collector works harder before the
            # kernel has to step in.
            - name: GOMEMLIMIT
              value: 40MiB
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 48Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: ownership-map
              mountPath: /etc/muster
              readOnly: true
            - name: salt
              mountPath: /etc/muster-salt
              readOnly: true
      volumes:
        - name: ownership-map
          configMap:
            name: muster-ownership-map
        - name: salt
          secret:
            secretName: muster-salt
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: muster
  namespace: clearedstack
  labels:
    app.kubernetes.io/name: muster
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: muster
  ports:
    - name: http
      port: 8080
      targetPort: http
